<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>宏樸日心說群島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="scene/theme.css">
<link rel="stylesheet" href="core/app.css">
</head>
<body>
<!-- 3D 場景（美術）：sky、stage、labels、hint -->
<div id="sky"></div>
<div id="stage" aria-label="宏樸日心說群島 3D 地圖"></div>
<div class="labels" id="labels"></div>
<div class="hint" id="hint">拖曳旋轉・點選小島查看內容・點公告島地面，柴犬會跑過去</div>

<!-- 2D 後備畫面：WebGL 無法使用，或網址加 ?view=2d -->
<main id="fallback" class="fallback" aria-label="簡易模式島嶼清單"></main>

<!-- 頂列（整合） -->
<header class="topbar">
  <div class="brand"><h1>宏樸日心說群島</h1><p>社區公告與規範・住戶專用 <span id="mockflag" class="mock" hidden>測試資料</span></p></div>
  <div class="bar-right">
    <div class="timebar" role="group" aria-label="切換時段">
      <button data-mode="day">白天</button><button data-mode="dusk">黃昏</button><button data-mode="night">夜晚</button>
    </div>
    <div class="userbox" id="userbox"></div>
  </div>
</header>

<!-- 資訊面板（整合） -->
<aside class="panel" id="panel" aria-live="polite" inert>
  <header><div><h2 id="p-title"></h2><p class="sub" id="p-sub"></p></div>
  <button class="close" id="p-close" aria-label="關閉">✕</button></header>
  <div class="body" id="p-body"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<!-- 載入順序：設定 → 第三方 → 註冊表 → 3D（美術）→ 串接核心 → 面板 → 主程式 -->
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="islands/registry.js"></script>
<script src="scene/props/package.js"></script>
<script src="scene/props/ev.js"></script>
<script src="scene/props/gym.js"></script>
<script src="scene/scene.js"></script>
<script src="mock/mock.js"></script>
<script src="core/api.js"></script>
<script src="core/auth.js"></script>
<script src="core/md.js"></script>
<script src="rules/rules.js"></script>
<script src="panels/rules.js"></script>
<script src="panels/notice.js"></script>
<script src="panels/package.js"></script>
<script src="panels/admin.js"></script>
<script src="core/app.js"></script>
</body>
</html>
